[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-input"
version = "2.2.1"
description = "跨设备语音输入传输系统 - 将手机端语音识别文本传送到电脑"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "mofanx", email = "yanwuning@live.cn"}
]
maintainers = [
    {name = "mofanx", email = "yanwuning@live.cn"}
]
requires-python = ">=3.8"
keywords = ["voice", "input", "clipboard", "cross-device"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "flask>=2.2",
    "pyclip>=0.7",
    "keyboard>=0.13",
]

[project.optional-dependencies]
production = ["waitress>=2.1"]
config = ["pyyaml>=6.0"]
relay = ["aiohttp>=3.9"]
all = ["waitress>=2.1", "pyyaml>=6.0", "aiohttp>=3.9"]

[project.scripts]
voice-input = "voice_input.cli:main"
voice-input-send = "voice_input.send:main"
voice-input-relay = "voice_input.relay_server:main"
voice-input-relay-client = "voice_input.relay_client:main"

[project.urls]
Homepage = "https://github.com/mofanx/voice-input"

[tool.setuptools.packages.find]
include = ["voice_input*"]

[tool.setuptools.package-data]
voice_input = ["templates/*.html"]
