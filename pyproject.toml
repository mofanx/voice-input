[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-input"
version = "3.1.0"
description = "跨设备语音输入传输系统 - 将手机端语音识别文本传送到电脑"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "mofanx", email = "yanwuning@live.cn"}
]
maintainers = [
    {name = "mofanx", email = "yanwuning@live.cn"}
]
requires-python = ">=3.8"
keywords = ["voice", "input", "clipboard", "cross-device"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "flask>=2.2",
    "pyclipx>=0.8.0",
    "keyboard>=0.13",
]

[project.optional-dependencies]
production = ["waitress>=2.1"]
config = ["pyyaml>=6.0"]
relay-agent = [
    "httpx>=0.24,<1",
    "websockets>=11,<16",
]
relay-server = [
    "fastapi>=0.100,<1",
    "uvicorn[standard]>=0.23,<1",
    "websockets>=11,<16",
]
relay = [
    "httpx>=0.24,<1",
    "websockets>=11,<16",
    "fastapi>=0.100,<1",
    "uvicorn[standard]>=0.23,<1",
]
all = [
    "waitress>=2.1",
    "pyyaml>=6.0",
    "httpx>=0.24,<1",
    "websockets>=11,<16",
    "fastapi>=0.100,<1",
    "uvicorn[standard]>=0.23,<1",
]

[project.scripts]
voice-input = "voice_input.cli:main"
voice-input-send = "voice_input.send:main"
voice-input-relay-agent = "voice_input.relay.agent:main"
voice-input-relay-server = "voice_input.relay.server:main"

[project.urls]
Homepage = "https://github.com/mofanx/voice-input"

[tool.setuptools.packages.find]
include = ["voice_input*"]

[tool.setuptools.package-data]
voice_input = ["templates/*.html"]
